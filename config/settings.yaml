# ---------------------------------------------------------------------------
# StockWatch beallitasok.  Minden ertek felulirhato; a kommentek megmondjak,
# mire hat.  A titkok (Telegram token) NEM ide, hanem a .env fajlba mennek.
# ---------------------------------------------------------------------------

data:
  provider: yahoo           # jelenleg: yahoo (yfinance)
  interval: 1d              # napi gyertyak - swing idotav
  history_years: 10         # ennyi evnyi historiat tartunk meg tickerenkent
  refresh_minutes: 15       # nyitvatartas alatti frissitesi gyakorisag

# --- Lemezhasznalati plafonok (lasd housekeeping.py) ---
storage:
  ohlcv_retention_years: 10   # ennel regebbi sorok levagva a CSV-bol
  signals_max_mb: 5           # ekkora meretnel rotal a signals.jsonl
  signals_backups: 3          # ennyi archivumot tartunk meg
  log_max_mb: 5
  log_backups: 3
  state_retention_days: 90    # lezart jelzesek megorzese a state.json-ben
  max_data_mb: 100            # e folott figyelmeztetes a logba es a dashboardra

# --- Swing pivot detektalas (structure.py) ---
structure:
  zigzag_atr_mult: 1.5      # ennyi ATR-nyi visszahuzas erosit meg egy pivotot
  fractal_left: 3
  fractal_right: 3
  atr_period: 14

# --- Support / rezisztencia motor (levels.py) ---
levels:
  lookback_bars: 500        # ennyi gyertyan keressuk a szinteket
  cluster_atr_mult: 0.5     # klaszterezesi turés: max(0.5*ATR, min_pct)
  cluster_min_pct: 0.003    # 0.3%
  volume_profile_bins: 50
  recency_halflife_days: 90 # a frissesegi sulyozas felezesi ideje
  max_levels: 12            # ennyi legerosebb szintet adunk vissza
  round_number_enabled: true

# --- Formaciofelismeres (patterns/) ---
patterns:
  min_pattern_bars: 10      # ennel rovidebb formaciot nem fogadunk el
  max_pattern_bars: 180
  min_quality: 0.62         # e alatti minosegu talalat nem general jelzest
  tolerance_atr_mult: 0.7   # aljak/tetok egyezesenek turése (ATR-ben)
  trendline_max_error_ratio: 0.12  # vonalillesztes max hibaja a formacio magassagahoz kepest

# --- Elorejelzes (forecast.py) ---
forecast:
  weights:                  # az ot komponens sulya, osszeguk 1.0
    pattern: 0.35
    trend: 0.20
    momentum: 0.15
    levels: 0.20
    volume: 0.10
  min_samples_for_probability: 30   # ez alatt "nincs eleg adat"
  min_risk_reward: 1.5              # ez alatt "gyenge minoseg" jeloles

# --- Backtest / kalibracio (backtest.py) ---
backtest:
  years: 10
  max_horizon_mult: 2.0     # a formacio hosszanak ennyiszerese a max varakozas
  max_horizon_bars: 120
  quality_buckets: [0.55, 0.7, 0.85]

# --- Riasztasok (alerts/) ---
alerts:
  console: true
  jsonl: true
  telegram: false           # helyette Discord
  discord: true             # csak ha DISCORD_WEBHOOK_URL a titokfajlban (python cli.py discord)
  webhook: true             # Google Chat / Slack - csak ha ALERT_WEBHOOK_URL a .env-ben
  send_chart: true          # chart kep csatolasa a Discord / Telegram uzenethez
  heartbeat: true           # napi eletjel zaras utan (Discord) + uzenet a monitor indulasakor
  quiet_hours: []           # pl. ["22:00-07:00"] helyi ido szerint
  min_seconds_between: 5    # Telegram rate-limit vedelem
  # A regi, formacio-allapotonkenti riasztasok (uj minta, kitores, cel, bukas -
  # bearish mintakra is). Kikapcsolva, hogy CSAK a swing long belepesi jelzesek
  # jojjenek. Ha ezeket is kered: true
  pattern_events: false
  direction: both

# --- Swing LONG belepesi motor (entry.py) ---
# Riasztas csak zaras utan (lezart napi gyertyan), csak long iranyba,
# es csak ha MINDEN kemeny szuro atment ES a pontszam >= min_score.
# A program SEMMIT nem vasarol - csak ertesit.
entry:
  enabled: true
  min_score: 50.0             # 0-100; a pontszam NEM valoszinuseg (rangsorolasra valo)
  alert_setups: true        # "elokeszulet" jelzes (meg nem tort ki, 1 ATR-en belul)
  cooldown_days: 10         # ugyanarra a mintara ennyi napig nincs ujabb riasztas

  # kemeny szurok
  require_uptrend: true     # zaro > SMA200 es EMA50 > EMA200
  rsi_min: 45
  rsi_max: 72
  # Kitoresi volumen kemeny szurokent (kitoresi nap / 20 napos atlag).
  # 0 = kikapcsolva, a volumen csak a pontszamban szamit. A 10 eves backteszten
  # az 1.3-as kuszob a JOBB kitoreseket szorta ki (+0.43R vs +0.79R).
  # Tankonyvi beallitas: 1.3
  min_breakout_volume: 0
  max_extension_atr: 1.5    # ennel messzebb a trigger folott mar ne uldozzuk
  min_risk_reward: 2.0
  min_stop_atr: 2.0         # a stop legalabb ennyi ATR-re a belepotol (kutatas: 2.0 > 1.5)
  max_stop_pct: 12          # ennel tagabb stop mar nem swing trade
  # Momentum / erosseg szurok - KIKAPCSOLVA. A 2026-10-i kutatas (README) a holdoutban
  # nem igazolta oket; az `entry-research --universe --study` ujra lemeri.
  min_high52_ratio: 0       # pl. 0.90: zaro >= az 52 hetes csucs 90%-a
  # min_momentum_pct: 0     # 12-1 honapos hozam legalabb ennyi %
  # min_rel_strength: 0     # 60 napos hozam - QQQ hozama, szazalekpont
  max_contraction: 0        # pl. 0.80: kitores elotti napi sav <= a szokasos 80%-a

  # belepes modja (entry-research alapjan)
  # Megerosites: a kitores UTANI nap zaroja is a trigger felett legyen.
  # 10 papiron: nyeresi arany 48% -> 67%, a leghosszabb vesztes sorozat 5 -> 3.
  confirm_breakout: true
  alert_retests: false      # visszateszt-jelzes (kevés mintan instabil volt)

  # kilepes - a jelzesben terv, a rendszer koveti es ertesit (python cli.py positions)
  #   target        teljes pozicio a celig
  #   partial       fele +1R-nel, utana stop a belepore, a maradek a celig  <- legtobb nyero trade
  #   trail         nincs fix cel, kovetett stop
  #   partial_trail fele +1R-nel, a maradek kovetett stoppal
  exit_mode: partial
  partial_r: 1.0
  trail_atr: 3.0
  track_positions: true

  # visszateszt / elokeszulet
  retest_max_bars: 10
  retest_zone_atr: 0.6
  setup_max_distance_atr: 1.0

  # piaci kornyezet
  benchmark: auto           # piaci rezsim: benchmark zaro > SMA200. auto = az atnezett index
                            # ETF-je (S&P 500 -> SPY, csak Nasdaq-100 / watchlist -> QQQ); vagy egy ticker
  regime_filter: true
  earnings_blackout_days: 7 # gyorsjelentes elott ennyi naptari napig nincs belepes
  earnings_unknown_blocks: false

  # pozicio meret javaslat (USD) - allitsd a sajat szamladra
  account_size: 10000
  risk_per_trade_pct: 1.0   # egy trade max. vesztesege a szamla %-aban
  max_position_pct: 25.0      # egy papir max. sulya a szamlaban
  # Eros jelzes nagyobb merettel: pontszam >= boost_score -> kockazat x boost_risk_mult.
  # 0 = kikapcsolva. Elobb a Laborban teszteld (kiserlet: "pontszam >= 70: 1,5x kockazat").
  boost_score: 0
  boost_risk_mult: 1.5

  # vegrehajtas (a jelzesben limitkent, a backtestben szimulalva)
  entry_max_gap_pct: 1.0    # masnapi nyito ennyivel lehet a zaro felett
  slippage_bps: 5
scan:
  nasdaq100: true
  sp500: true
  index_setups: false
broker:
  auto_trade: true
  size_from_account: true
  max_open_trades: 5
  entry_window_min: 5       # kitores: ha a nyitas utan ennyi perccel sem teljesult, visszavonja (0 = ki)
  live_gate_min_trades: 50  # elesitesi kapu: lezart paper trade-ek szama
  live_gate_win: 0.70       # elesitesi kapu: nyeresi arany
  live_gate_pf: 1.3         # elesitesi kapu: profit-faktor

# --- Strategia-labor / gepi tanulas arnyek-uzeme (shadow.py) ---
lab:
  # auto: csak ha a labor walk-forward tesztje szerint a modell mintan kivul jobb a mostani
  #       szuroknel | on: mindig, ha van mentett modell | off: soha
  # Arnyek-uzemben a becsles a jelzes melle kerul es naplozodik, de SEMMIROL nem dont.
  shadow: auto

# --- Hir- es hangulatelemzes (sentiment) - ARNYEK-UZEM: a jelzes melle irja, NEM dont ---
# Terv: docs/SENTIMENT-DESIGN.md. A SEC kerese: .env-ben SEC_USER_AGENT="Nev e-mail@cim".
sentiment:
  enabled: true
  sources: [edgar, yahoo, alpaca]   # alpaca: csak paper kulccsal es ha a fiok csomagja tartalmazza a hireket
  history_days: 120                 # elo frissiteskor ennyi napra vissza (EDGAR, Alpaca)
  cache_minutes: 60                 # forrasonkent ennyi ideig nem kerdezzuk ujra ugyanazt a papirt
  max_symbols_per_cycle: 30         # egy monitor-korben legfeljebb ennyi papir hirei frissulnek
