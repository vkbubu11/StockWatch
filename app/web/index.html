<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockWatch</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/learn">
      <img src="/img/logo.png" alt="" width="28" height="28">
      <span>StockWatch</span>
    </a>
    <nav class="tabs" aria-label="Fő navigáció">
      <a href="#/learn" data-tab="learn">Tanulás</a>
      <a href="#/practice" data-tab="practice">Gyakorlás</a>
      <a href="#/daily" data-tab="daily">Napi kihívás</a>
      <a href="#/leaderboard" data-tab="leaderboard">Ranglista</a>
      <a href="#/profile" data-tab="profile">Profil</a>
      <a href="#/info" data-tab="info">Információ</a>
    </nav>
    <div class="topbar-right">
      <button id="theme" class="btn icon" type="button" title="Világos / sötét téma" aria-label="Téma váltása">◐</button>
      <button id="logout" class="btn" type="button">Kijelentkezés</button>
    </div>
  </header>

  <main id="view" class="view" aria-live="polite">
    <div class="loading">Betöltés…</div>
  </main>

  <footer class="footer">
    Oktatási célú gyakorlás múltbeli / szimulált adaton. <strong>Nem befektetési tanács.</strong>
    · <a href="/aszf" target="_blank">ÁSZF</a> · <a href="/adatkezeles" target="_blank">Adatkezelés</a> · <a href="/sutik" target="_blank">Sütik</a>
  </footer>

  <!-- telefonon: also sav; asztalon rejtett -->
  <nav class="bottom-nav" aria-label="Gyors navigáció">
    <a href="#/learn" data-tab="learn"><span class="bn-icon" aria-hidden="true">★</span><span>Tanulás</span></a>
    <a href="#/practice" data-tab="practice"><span class="bn-icon" aria-hidden="true">◎</span><span>Gyakorlás</span></a>
    <a href="#/daily" data-tab="daily"><span class="bn-icon" aria-hidden="true">◷</span><span>Napi</span></a>
    <button type="button" id="more-btn" aria-expanded="false" aria-controls="more-sheet"><span class="bn-icon" aria-hidden="true">☰</span><span>Továbbiak</span></button>
  </nav>
  <div id="more-sheet" class="more-sheet" hidden><nav class="more-list" aria-label="Minden nézet"></nav></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <script src="i18n.js"></script>
  <script src="chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
