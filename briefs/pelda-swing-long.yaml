# Pelda kutatasi cel (brief) a kutatougynoknek:  python cli.py agent run --brief briefs/pelda-swing-long.yaml
# A kivalasztas CSAK a tanito idoszakon (2022 elott) tortenik; a validaciot csak a dontosokre nezi meg;
# a zarolt holdout (2025-04-tol) erintetlen. Nem befektetesi tanacs.
name: Swing long - Nasdaq-100 + S&P 500
description: Visszahuzas-csalad, heti 0,5-2 kotes, max. 10% visszaeses, legfeljebb 15 nap tartas, 15 bps / oldal.
engine: pullback          # pullback | deep | etf | breakout
universe: indexes         # indexes | nasdaq100 | sp500 | watchlist | etf | research
objective:
  trades_per_week: [0.5, 2.0]
  max_drawdown_pct: 10
  max_hold_days: 15
  cost_bps: 15
  min_win_lo: null        # opcionalis feltetel, pl. 0.65 (a nyeresi arany Wilson-also hatara)
  min_pf: 1.3
  min_trades: 30
search:
  seed: 42
  method: halving         # grid | random | halving
  max_variants: 300
  max_cpu_minutes: 120
  fixed: {}               # pl. {regime_filter: true}
