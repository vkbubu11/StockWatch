name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fuggosegek
        run: pip install -r requirements.txt
      - name: Bongeszo a reszponziv tesztekhez (Playwright + Chromium)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Tesztek
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/screens
          # Neon (a tesztek ideiglenes, utana torolt semaban futnak); titok nelkul az adatbazis-tesztek kimaradnak
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: pytest -q
      - name: Kepernyokepek (minden nezet, 360-1280 px, vilagos / sotet)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 14
